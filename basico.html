<title>Plano Básico IPTV</title>

<style>

/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    font-family: Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* Card */
.plano-basico{
    width:320px;
    padding:40px;
    text-align:center;

    background: rgba(0,0,0,0.85);
    border-radius:18px;

    border:1px solid rgba(0,240,255,0.5);

    box-shadow:
    0 0 20px rgba(0,240,255,0.4),
    inset 0 0 10px rgba(0,0,0,0.8);

    backdrop-filter: blur(10px);

    transition:0.4s ease;
}

.plano-basico:hover{
    transform:translateY(-10px);
    box-shadow:
    0 0 35px rgba(255,0,255,0.8);
}

.plano-basico h1{
    color:#ff00ff;
    margin-bottom:30px;
    text-shadow:0 0 15px #ff00ff;
}

/* Lista */
.plano-basico ul{
    list-style:none;
}

.plano-basico ul li{
    margin:15px 0;
}

.plano-basico ul li a{
    display:block;
    text-decoration:none;
    color:white;

    padding:14px;
    border-radius:30px;

    background: linear-gradient(90deg,#00f0ff,#ff00ff);

    font-weight:bold;

    transition:0.3s;
}

.plano-basico ul li a:hover{
    opacity:0.85;
    transform:scale(1.05);
}

</style>

</head>
